<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #f8f8f8;
            border-top: 3px solid #ddd;
            padding: 20px;
        }
        main {
            background-color: #ffffff;
            flex: 1;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        footer {
            background-color: #f8f8f8;
            border-bottom: 3px solid #ddd;
            padding: 20px;
        }
        @media (max-width: 600px) {
            header, main, footer {
                padding: 10px;
            }
        }
        .waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }
        .wave1 {
            animation: wave1 15s linear infinite;
        }
        .wave2 {
            animation: wave2 20s linear infinite;
        }
        @keyframes wave1 {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes wave2 {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <header></header>
    <main>
        <svg class="waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path class="wave1" d="M0,160 Q360,120 720,160 T1440,160 V320 H0 Z" fill="rgba(200,200,200,0.2)"></path>
            <path class="wave2" d="M0,180 Q360,140 720,180 T1440,180 V320 H0 Z" fill="rgba(180,180,180,0.1)"></path>
        </svg>
    </main>
    <footer></footer>
</body>
</html>
